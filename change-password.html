<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | LaundryEase</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <div class="login-box">
            <h1>🧺 LaundryEase</h1>
            <h2>Change Password</h2>

            <form id="changeForm">
                <input id="currentPassword" type="password" placeholder="Current Password" required>

                <input id="newPassword" type="password" placeholder="New Password" minlength="8" required>

                <input id="confirmPassword" type="password" placeholder="Confirm New Password" required>

                <button type="submit">Update Password</button>
            </form>

            <p id="message" aria-live="polite"></p>
            <a href="student-dashboard.html">Back to Dashboard</a>
        </div>
    </main>

    <script type="module" src="change-password.js"></script>
</body>

</html>
