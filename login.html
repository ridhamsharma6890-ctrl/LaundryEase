<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | LaundryEase</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <div class="login-box">
            <h1>🧺 LaundryEase</h1>
            <h2>Student Login</h2>

            <form id="loginForm">
                <input id="email" type="email" placeholder="Enter your registered email" required>

                <input id="password" type="password" placeholder="Enter password" required> <button
                    type="submit">Continue</button>
            </form>

            <p id="message"></p>
            <p>New student? <a href="register.html">Register</a></p>
            <p><a href="forgot-password.html">Forgot Password?</a></p>
        </div>
    </main>

    <script type="module" src="login.js"></script>
</body>

</html>
