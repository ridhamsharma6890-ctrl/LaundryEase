<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | LaundryEase</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <div class="login-box">
            <h1>🧺 LaundryEase</h1>
            <h2>Laundry Staff Login</h2>

            <form id="staffLoginForm">
                <input type="email" id="staffEmail" placeholder="Enter Staff Email" required>

                <input type="password" id="staffPassword" placeholder="Enter Password" required>

                <button type="submit">Login as Staff</button>
            </form>

            <p id="message" aria-live="polite"></p>
            <a href="index.html">Back to Home</a>
        </div>
    </main>

    <script type="module" src="staff-login.js"></script>
</body>

</html>
